name: Publish Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - builds

permissions:
  contents: write

jobs:
  publish-build:
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ORPHEUS_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ORPHEUS_RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ORPHEUS_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ORPHEUS_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build metadata
        id: metadata
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to resolve versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG_NAME="build-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          RELEASE_NAME="BlazaresOrpheus ${VERSION_NAME} (release build)"
          PACKAGE_BASENAME="BlazaresOrpheus-${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_basename=$PACKAGE_BASENAME" >> "$GITHUB_OUTPUT"

      - name: Prepare optional release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          ANY_SIGNING_VALUE=false
          for value in \
            "$RELEASE_KEYSTORE_BASE64" \
            "$RELEASE_KEYSTORE_PASSWORD" \
            "$RELEASE_KEY_ALIAS" \
            "$RELEASE_KEY_PASSWORD"; do
            if [ -n "$value" ]; then
              ANY_SIGNING_VALUE=true
            fi
          done

          if [ "$ANY_SIGNING_VALUE" = true ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || \
               [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || \
               [ -z "$RELEASE_KEY_ALIAS" ] || \
               [ -z "$RELEASE_KEY_PASSWORD" ]; then
              echo "Release signing secrets are only partially configured." >&2
              exit 1
            fi

            KEYSTORE_PATH="$RUNNER_TEMP/orpheus-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ORPHEUS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ORPHEUS_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORPHEUS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORPHEUS_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; release artifacts will be unsigned." >&2
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK and Android App Bundle
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Stage release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          AAB_PATH=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)

          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "Release APK or AAB was not produced." >&2
            exit 1
          fi

          APK_OUT="dist/${{ steps.metadata.outputs.package_basename }}.apk"
          AAB_OUT="dist/${{ steps.metadata.outputs.package_basename }}.aab"
          CHECKSUM_OUT="dist/${{ steps.metadata.outputs.package_basename }}-SHA256SUMS.txt"
          ZIP_OUT="dist/${{ steps.metadata.outputs.package_basename }}.zip"

          cp "$APK_PATH" "$APK_OUT"
          cp "$AAB_PATH" "$AAB_OUT"
          sha256sum "$APK_OUT" "$AAB_OUT" > "$CHECKSUM_OUT"
          zip -j "$ZIP_OUT" "$APK_OUT" "$AAB_OUT" "$CHECKSUM_OUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          name: ${{ steps.metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          body: |
            Automated BlazaresOrpheus release build publication.

            - Version: `${{ steps.metadata.outputs.version_name }}`
            - Channel: `builds`
            - Commit: `${{ github.sha }}`
            - Workflow run: `${{ github.run_number }}`
            - Release signing configured: `${{ steps.signing.outputs.signing_enabled }}`
            - R8/code shrinking: enabled
            - Resource shrinking: enabled

            For Play distribution, configure all four `ORPHEUS_RELEASE_*` repository secrets so the generated APK/AAB use the project release key.
          files: |
            dist/${{ steps.metadata.outputs.package_basename }}.apk
            dist/${{ steps.metadata.outputs.package_basename }}.aab
            dist/${{ steps.metadata.outputs.package_basename }}-SHA256SUMS.txt
            dist/${{ steps.metadata.outputs.package_basename }}.zip
